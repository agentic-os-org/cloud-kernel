%YAML 1.2
---
$id: http://devicetree.org/schemas/riscv/ntrace/xuantie_ntrace,funnel-controller.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: RISC-V XUANTIE N-Trace funnel controller

maintainers:
  - Jiangshuai Li <jiangshuai_li@linux.alibaba.com>
  - Chen Pei <cp0613@linux.alibaba.com>

description: |
  The funnel merges the trace streams of several upstream components into one
  downstream component. Each input port is enabled individually, so the
  encoder and funnel nodes feeding this funnel must list it in their
  output_port.

  Funnel registers are accessed through the memory region given in reg.

properties:
  compatible:
    const: xuantie_ntrace,funnel-controller

  reg:
    maxItems: 1
    description:
      Funnel register region.

  level:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [1, 2]
    default: 1
    description:
      Funnel depth in the trace tree. Level 1 collects encoder streams, level
      2 collects level 1 funnel streams.

  input_port:
    type: object
    description:
      Container of the funnel input ports. Each child node describes one port
      and must carry an "endpoint" phandle pointing at the upstream component
      node. The referenced node must provide a 4-element reg property, from
      which the driver builds the 64-bit register base address (reg[0] is the
      high half, reg[1] the low half).

    patternProperties:
      ".*":
        type: object
        properties:
          endpoint:
            $ref: /schemas/types.yaml#/definitions/phandle
        required:
          - endpoint
        additionalProperties: false

  output_port:
    type: object
    description:
      Container of the funnel output ports, using the same port description as
      input_port.

    patternProperties:
      ".*":
        type: object
        properties:
          endpoint:
            $ref: /schemas/types.yaml#/definitions/phandle
        required:
          - endpoint
        additionalProperties: false

  '#address-cells':
    const: 1

  '#size-cells':
    const: 0

required:
  - compatible
  - reg
  - input_port
  - output_port

additionalProperties: false

example:
  - |
    funnel1: funnel@2020001000 {
        compatible = "xuantie_ntrace,funnel-controller";
        reg = <0x20 0x20001000 0x0 0x1000>;
        level = <1>;
        #address-cells = <1>;
        #size-cells = <0>;

        input_port {
            funnel1_in_0 {
                endpoint = <&encoder0>;
            };
            funnel1_in_1 {
                endpoint = <&encoder1>;
            };
        };

        output_port {
            funnel1_out_0 {
                endpoint = <&sink0>;
            };
        };
    };

...
