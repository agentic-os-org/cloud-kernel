%YAML 1.2
---
$id: http://devicetree.org/schemas/riscv/ntrace/xuantie_ntrace,sink-controller.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: RISC-V XUANTIE N-Trace sink controller

maintainers:
  - Jiangshuai Li <jiangshuai_li@linux.alibaba.com>
  - Chen Pei <cp0613@linux.alibaba.com>

description: |
  The sink collects the merged trace stream and writes it either into a
  reserved memory region (memory-region) or into a DMA coherent buffer
  allocated by the driver (iommu-trace-buffer-size). The perf auxtrace
  back-end reads the buffer through the sink registers given in reg.

  Sink registers are accessed through the memory region given in reg.

properties:
  compatible:
    const: xuantie_ntrace,sink-controller

  reg:
    maxItems: 1
    description:
      Sink register region.

  working_mode:
    $ref: /schemas/types.yaml#/definitions/string
    description:
      Sink operating mode as reported by the driver at probe time. The driver
      only records and prints this string, defaulting to
      "circulating buffer", which is the only mode the hardware currently
      supports.

  format:
    $ref: /schemas/types.yaml#/definitions/string
    description:
      Data format stored in the trace buffer. The driver only records and
      prints this string, defaulting to "original" (raw N-Trace message
      stream).

  memory-region:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle of a reserved-memory node holding the trace buffer. When
      absent, the driver allocates a DMA coherent buffer instead.

  iommu-trace-buffer-size:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Size in bytes of the DMA coherent trace buffer. Only read when
      memory-region is absent; a value of 0 selects the driver default.

  input_port:
    type: object
    description:
      Container of the sink input ports. Each child node describes one port
      and must carry an "endpoint" phandle pointing at the upstream funnel
      node. The referenced node must provide a 4-element reg property, from
      which the driver builds the 64-bit register base address (reg[0] is the
      high half, reg[1] the low half).

    patternProperties:
      ".*":
        type: object
        properties:
          endpoint:
            $ref: /schemas/types.yaml#/definitions/phandle
        required:
          - endpoint
        additionalProperties: false

  '#address-cells':
    const: 1

  '#size-cells':
    const: 0

required:
  - compatible
  - reg
  - input_port

additionalProperties: false

example:
  - |
    sink0: sink@2020002000 {
        compatible = "xuantie_ntrace,sink-controller";
        reg = <0x20 0x20002000 0x0 0x1000>;
        working_mode = "circulating buffer";
        format = "original";
        memory-region = <&ntrace_reserved>;
        #address-cells = <1>;
        #size-cells = <0>;

        input_port {
            sink0_in_0 {
                endpoint = <&funnel1>;
            };
        };
    };

...
